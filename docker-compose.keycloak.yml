services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: ecommerce-keycloak
    command: start --import-realm
    environment:
      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: DbP@ssw0rd!2026Secure
      
      # Admin (use both formats for compatibility)
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: AdminP@ssw0rd!2026Secure
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: AdminP@ssw0rd!2026Secure
      
      # Hostname & Proxy
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${KC_HOSTNAME_PORT:-8080}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-false}
      KC_HOSTNAME_STRICT_HTTPS: ${KC_HOSTNAME_STRICT_HTTPS:-false}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      
      # Health & Metrics
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      
      # Logging
      KC_LOG_LEVEL: INFO
      KC_LOG_CONSOLE_OUTPUT: default
      
      # Email (configured via realm, but can override)
      KC_SMTP_HOST: ${KC_SMTP_HOST:-}
      KC_SMTP_PORT: ${KC_SMTP_PORT:-587}
      KC_SMTP_USER: ${KC_SMTP_USER:-}
      KC_SMTP_PASSWORD_FILE: /run/secrets/kc_smtp_password
      KC_SMTP_FROM: ${KC_SMTP_FROM:-}
      KC_SMTP_STARTTLS: ${KC_SMTP_STARTTLS:-true}
      KC_SMTP_SSL: ${KC_SMTP_SSL:-false}
      
      # Realm Import (imports all .json files from data/import/)
      # KC_IMPORT not needed -- --import-realm flag scans data/import/ automatically
      
      # Cache (default is fine for single-node)
      # KC_CACHE_STACK: unset = default
      
      # SPI (defaults are fine)
      
    ports:
      - "${KC_HTTP_PORT:-8080}:8080"
      - "${KC_HTTPS_PORT:-8443}:8443"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/themes:/opt/keycloak/themes
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    secrets:
      - kc_admin_password
      - kc_db_password
      - kc_smtp_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e \"GET / HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - keycloak-network

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: DbP@ssw0rd!2026Secure
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    secrets:
      - kc_db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - keycloak-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ecommerce-mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped
    networks:
      - keycloak-network

volumes:
  keycloak_data:
    driver: local
  keycloak_db_data:
    driver: local

secrets:
  kc_admin_password:
    file: ./secrets/kc_admin_password.txt
  kc_db_password:
    file: ./secrets/kc_db_password.txt
  kc_smtp_password:
    file: ./secrets/kc_smtp_password.txt

networks:
  keycloak-network:
    driver: bridge
    name: ecommerce-keycloak-network